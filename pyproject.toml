[project]
name = "kcal"
dynamic = ["version"]
description = "Fetch daily steps and workout calories from Garmin Connect, with workout steps deduplicated from the daily total."
requires-python = ">=3.12"
dependencies = [
    "anyio>=4",
    "garminconnect>=0.3.19,<0.4",
    "mcp>=1.10,<2",
    "uvicorn>=0.31.1",
]

[project.scripts]
kcal = "kcal.cli:main"
kcal-mcp = "kcal.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "kcal.__version__"}
