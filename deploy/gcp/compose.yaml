# garmin-reader on one VM: the server, with Caddy in front of it for HTTPS
# (certificates from Let's Encrypt, renewed automatically).
# Settings come from .env next to this file (written by setup-vm.sh),
# including the commit being deployed, which the image records.
# See docs/deployment.md, "Google Cloud VM".
# The project name prefixes the volumes' real names (garmin-reader_data):
# changing it starts from empty volumes unless their contents are copied.
name: garmin-reader

services:
  garmin-reader:
    image: garmin-reader
    build:
      context: ../..
      args:
        GARMIN_READER_GIT_COMMIT: ${GARMIN_READER_GIT_COMMIT:-}
    restart: unless-stopped
    environment:
      GARMIN_READER_PUBLIC_URL: https://${GARMIN_READER_DOMAIN:?set GARMIN_READER_DOMAIN in .env}
      # Caddy's address, so logs show the real client from X-Forwarded-For.
      FORWARDED_ALLOW_IPS: 172.30.0.10
    volumes:
      - data:/data
    networks: [web]
    # No published port: only Caddy can reach the server.

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"   # certificate checks and the redirect to HTTPS
      - "443:443"
      - "443:443/udp"
    environment:
      GARMIN_READER_DOMAIN: ${GARMIN_READER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data   # certificates
      - caddy-config:/config
    networks:
      web:
        ipv4_address: 172.30.0.10
    depends_on: [garmin-reader]

networks:
  web:
    ipam:
      config:
        # Fixed range so Caddy's address is known; other containers get
        # addresses from ip_range, which leaves Caddy's free.
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  data:          # Garmin tokens and the OAuth database
  caddy-data:
  caddy-config:
